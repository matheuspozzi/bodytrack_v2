<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a18"><meta name="description" content="BodyTrack — evolução física, nutrição e treinos.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png">
<title>BodyTrack</title>
<style>
:root{--bg:#111512;--panel:#1b211d;--panel2:#252d27;--text:#edf2ee;--muted:#9ba89f;--line:#344038;--accent:#91c99c;--accentText:#122016;--danger:#e38c8c;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f5f2;--panel:#fff;--panel2:#eaf0eb;--text:#202923;--muted:#68756c;--line:#dce4dd;--accent:#397e4c;--accentText:#fff;--danger:#b83e3e;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:16px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{background:var(--accent);color:var(--accentText);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{font-size:18px;margin:0}.brand small,.muted{color:var(--muted)}.topright{display:flex;gap:7px;align-items:center}.nav{display:flex;gap:6px;padding:5px;border:1px solid var(--line);background:var(--panel);border-radius:15px;margin-bottom:20px;position:sticky;top:8px;z-index:5}.nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:10px}.nav button.active{background:var(--panel2);color:var(--text);font-weight:750}.nav b{display:block;font-size:17px}.btn,.icon{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}.btn.danger{color:var(--danger)}.icon{width:40px;height:40px;padding:0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 0 16px}.head h2{margin:0;font-size:26px}.head p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;min-width:0}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.metric{font-size:29px;font-weight:800;letter-spacing:-.8px;margin:6px 0 0}.metric small{font-size:12px;color:var(--muted);letter-spacing:0}.card h3{font-size:16px;margin:0 0 12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:10px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,input,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}.field textarea{min-height:70px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.item small{display:block;color:var(--muted)}.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:8px 11px}.tabs button.active{color:var(--text);background:var(--panel2);border-color:var(--accent)}.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.bar i{display:block;background:var(--accent);height:100%}.chart{width:100%;height:190px}.notice{background:var(--panel2);border-radius:10px;padding:11px;color:var(--muted);font-size:13px}.modalbg{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:14px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(600px,100%);max-height:90vh;overflow:auto}.hidden{display:none!important}.photo{width:100%;max-height:210px;object-fit:cover;border-radius:10px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}
@media(max-width:740px){.app{padding:12px 11px 95px}.nav{position:fixed;bottom:7px;left:7px;right:7px;top:auto;margin:0;box-shadow:0 8px 30px #0005}.nav button{font-size:11px;padding:7px 2px}.nav b{font-size:17px}.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.head h2{font-size:23px}.profileSel{max-width:125px}.brand small{display:none}}
</style></head><body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">B</div><div><h1>BODYTRACK</h1><small>Seu progresso, em dados.</small></div></div><div class="topright"><select id="profileSel" class="profileSel" aria-label="Perfil"></select><button class="icon" id="themeBtn" title="Alternar tema">◐</button></div></header>
<nav class="nav" id="nav"><button class="active" data-page="home"><b>▦</b>Início</button><button data-page="nutrition"><b>◉</b>Nutrição</button><button data-page="training"><b>✦</b>Treinos</button><button data-page="evolution"><b>⌁</b>Evolução</button><button data-page="profile"><b>☻</b>Perfil</button></nav>
<main id="main"></main><div class="foot">BodyTrack · Dados locais neste dispositivo · Faça backups regularmente</div></div><div id="modalRoot"></div>
<script>
(()=>{'use strict';
const DB='bodytrack-db',OLD='bodytrack-data-v1';let db,profiles=[],activeId=null,page='home',nt='food',tt='templates',et='weight',session=null,settings={theme:'system',accent:'#91c99c'},foods=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toISOString().slice(0,10),nfmt=(v,d=1)=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:d}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[['Arroz branco cozido','Cereais',128,2.5,28.1,.2,1.6],['Feijão carioca cozido','Leguminosas',76,4.8,13.6,.5,8.5],['Peito de frango grelhado','Carnes',159,32,0,2.5,0],['Ovo cozido','Ovos',146,13.3,.6,9.5,0],['Patinho grelhado','Carnes',219,35,0,7.3,0],['Banana','Frutas',89,1.1,22.8,.3,2.6],['Maçã com casca','Frutas',56,.3,15.2,.2,1.3],['Aveia em flocos','Cereais',394,13.9,66.6,8.5,9.1],['Pão francês','Padaria',300,8,58,3.1,2.3],['Leite integral','Laticínios',61,3.2,4.7,3.3,0],['Iogurte natural','Laticínios',51,4.1,5.5,1.5,0],['Batata-doce cozida','Tubérculos',77,.6,18.4,.1,2.2],['Macarrão cozido','Cereais',157,5.8,30.9,.9,1.8],['Tilápia grelhada','Peixes',128,26,0,2.7,0],['Salmão grelhado','Peixes',206,22,0,12,0],['Brócolis cozido','Vegetais',25,2.1,4.4,.5,3.4],['Tomate','Vegetais',18,.9,3.9,.2,1.2],['Queijo muçarela','Laticínios',300,22,3,22,0],['Amendoim torrado','Oleaginosas',606,22.5,18.7,54,7.8],['Whey protein referência','Suplementos',400,80,8,6,0],['Quinoa cozida','Cereais',120,4.4,21.3,1.9,2.8],['Abacate','Frutas',96,1.2,6,.2,6.3],['Carne moída cozida','Carnes',212,26,0,11.5,0],['Atum em água drenado','Peixes',116,25.5,0,1,0],['Lentilha cozida','Leguminosas',93,6.3,16.3,.5,7.9]];
const mkProfile=name=>({id:uid(),name,createdAt:new Date().toISOString(),profile:{height:null,age:null,sex:''},goals:{weight:null,weeklyRate:.25,calories:2500,protein:125,carbs:300,fat:70,water:2500},records:[],templates:[],photos:[]});
const p=()=>profiles.find(x=>x.id===activeId),recs=t=>(p()?.records||[]).filter(x=>!t||x.type===t).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;['profiles','foods','meta'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function all(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(s,v){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(v);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function del(s,id){return new Promise(ok=>{let r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=()=>ok()})}
async function saveP(){await put('profiles',p());profiles=await all('profiles')}
async function saveSettings(){await put('meta',{id:'settings',...settings})}
function applyTheme(){let t=settings.theme;if(t==='system')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.style.setProperty('--accent',settings.accent)}
async function init(){db=await openDB();profiles=await all('profiles');settings=await new Promise(ok=>{let r=db.transaction('meta').objectStore('meta').get('settings');r.onsuccess=()=>ok(r.result||settings)});foods=await all('foods');if(!foods.length){for(let f of seed)await put('foods',{id:uid(),name:f[0],category:f[1],kcal:f[2],protein:f[3],carbs:f[4],fat:f[5],fiber:f[6],estimated:false});foods=await all('foods')}
if(!profiles.length){let x=mkProfile('Meu perfil');let raw=localStorage.getItem(OLD);if(raw){try{let old=JSON.parse(raw);for(let r of old.logs||old.dailyLogs||[])x.records.push({...r,id:uid(),type:'daily',date:r.date||today()});for(let r of old.measurements||[])x.records.push({...r,id:uid(),type:'measurement',date:r.date||today()});for(let r of old.weights||[])x.records.push({...r,id:uid(),type:'weight',date:r.date||today()})}catch(e){}}await put('profiles',x);profiles=[x]}activeId=profiles[0].id;applyTheme();$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};$('#themeBtn').onclick=()=>{settings.theme=settings.theme==='dark'?'light':'dark';saveSettings();applyTheme();render()};render()}
function head(t,s){return `<div class="head"><div><h2>${t}</h2><p>${s}</p></div></div>`}
function metric(t,v,u,s){return `<div class="card s3"><div class="eyebrow">${t}</div><div class="metric">${v??'—'} <small>${u||''}</small></div><small class="muted">${s||''}</small></div>`}
function chart(arr){if(!arr.length)return '<div class="empty">Registre dados para visualizar a evolução.</div>';let vals=arr.map(x=>+x.v),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pts=vals.map((v,i)=>`${24+i*572/Math.max(1,vals.length-1)},${165-(v-min)/(max-min)*130}`).join(' ');return `<svg class="chart" viewBox="0 0 620 190" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>{let x=24+i*572/Math.max(1,vals.length-1),y=165-(v-min)/(max-min)*130;return `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`}).join('')}</svg><div class="row between muted"><small>${arr[0].date}</small><small>${arr.at(-1).date}</small></div>`}
function prog(label,v,g,u){return `<div style="margin:12px 0"><div class="row between"><b>${label}</b><small class="muted">${nfmt(v,0)} / ${nfmt(g,0)} ${u}</small></div><div class="bar"><i style="width:${Math.min(100,g?v/g*100:0)}%"></i></div></div>`}
function render(){let prof=p();$('#profileSel').innerHTML=profiles.map(x=>`<option value="${x.id}" ${x.id===activeId?'selected':''}>${esc(x.name)}</option>`).join('')+'<option value="__new">＋ Novo perfil</option>';$('#profileSel').onchange=async e=>{if(e.target.value==='__new'){let name=prompt('Nome do perfil:');if(name){let x=mkProfile(name);await put('profiles',x);profiles=await all('profiles');activeId=x.id}render()}else{activeId=e.target.value;session=null;render()}};$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const fn={home, nutrition, training, evolution, profile};$('#main').innerHTML=fn[page]();wire()}
function home(){let w=recs('weight'),weight=w[0]?.weight,meals=recs('meal').filter(x=>x.date===today()),k=meals.reduce((a,x)=>a+x.kcal,0),pr=meals.reduce((a,x)=>a+x.protein,0),water=recs('water').filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0),bmi=weight&&p().profile.height?weight/(p().profile.height/100)**2:null;return head('Visão geral','Resumo do dia e evolução.')+`<div class="grid">${metric('Peso atual',weight?nfmt(weight):'—','kg',p().goals.weight?'Meta '+p().goals.weight+' kg':'Registre seu peso')}${metric('IMC',bmi?nfmt(bmi):'—','',bmi<18.5?'Abaixo da faixa de referência':bmi<25?'Faixa de referência':'Acima da faixa de referência')}${metric('Calorias',nfmt(k,0),'kcal','Hoje')}${metric('Proteínas',nfmt(pr,0),'g','Hoje')}<div class="card s8"><h3>Evolução do peso</h3>${chart(w.slice(0,20).reverse().map(x=>({date:x.date,v:x.weight})))}</div><div class="card s4"><h3>Metas diárias</h3>${prog('Calorias',k,p().goals.calories,'kcal')}${prog('Proteínas',pr,p().goals.protein,'g')}${prog('Água',water,p().goals.water,'ml')}</div><div class="card s4"><h3>Hidratação</h3><div class="metric">${nfmt(water,0)} <small>ml</small></div><div class="row"><button class="btn" data-water="250">+250 ml</button><button class="btn" data-water="500">+500 ml</button></div></div><div class="card s4"><h3>Treinos no mês</h3><div class="metric">${recs('workout').filter(x=>x.date.slice(0,7)===today().slice(0,7)).length}</div><small class="muted">sessões concluídas</small></div><div class="card s4"><h3>Atalhos</h3><div class="stack"><button class="btn primary" data-pagego="evolution">＋ Registrar peso</button><button class="btn" data-pagego="nutrition">＋ Registrar refeição</button><button class="btn" data-pagego="training">＋ Iniciar treino</button></div></div></div>`}
function nutrition(){let content='';if(nt==='food'){let meals=recs('meal').filter(x=>x.date===today()),k=meals.reduce((a,x)=>a+x.kcal,0),pr=meals.reduce((a,x)=>a+x.protein,0);content=`<div class="grid">${metric('Calorias',nfmt(k,0),'kcal','Hoje')}${metric('Proteínas',nfmt(pr,0),'g','Hoje')}<div class="card s5"><h3>Adicionar alimento</h3><form id="mealForm" class="stack"><div class="field"><label>Pesquisar</label><input id="foodSearch" placeholder="Nome do alimento"></div><div class="field"><label>Alimento</label><select id="foodSel">${foods.map(f=>`<option value="${f.id}">${esc(f.name)} · ${f.kcal} kcal/100g</option>`).join('')}</select></div><div class="form"><div class="field"><label>Quantidade (g)</label><input id="grams" type="number" value="100" min="1"></div><div class="field"><label>Refeição</label><select id="mealType">${['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Pré-treino','Jantar','Ceia','Personalizada'].map(x=>`<option>${x}</option>`)}</select></div><div class="field"><label>Horário</label><input id="mealTime" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div><button class="btn primary">Adicionar refeição</button></form><button class="btn" data-modal="food" style="margin-top:10px">＋ Cadastrar alimento</button></div><div class="card s7"><h3>Consumo de hoje</h3>${meals.length?`<div class="list">${meals.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><small>${x.mealType} · ${x.grams} g · ${x.time}</small></div><div><b>${nfmt(x.kcal,0)} kcal</b><small>${nfmt(x.protein)} g proteína</small></div><button class="icon" data-del="${x.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Nenhuma refeição registrada hoje.</div>'}</div></div>`}
if(nt==='water'){let total=recs('water').filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0);content=`<div class="grid">${metric('Água hoje',nfmt(total,0),'ml','Meta '+p().goals.water+' ml')}<div class="card s8"><h3>Registrar água</h3><div class="row"><button class="btn" data-water="150">+150 ml</button><button class="btn" data-water="250">+250 ml</button><button class="btn" data-water="500">+500 ml</button></div><form id="waterForm" class="form" style="margin-top:12px"><div class="field"><label>Quantidade (ml)</label><input id="waterAmount" type="number" value="300"></div><div class="field"><label>Horário</label><input id="waterTime" type="time" value="${new Date().toTimeString().slice(0,5)}"></div><button class="btn primary full">Salvar consumo</button></form></div><div class="card s4"><h3>Meta</h3>${prog('Hidratação',total,p().goals.water,'ml')}</div></div>`}
if(nt==='supp'){let items=recs('supplement').filter(x=>x.date===today());content=`<div class="grid"><div class="card s5"><h3>Registrar suplemento</h3><form id="suppForm" class="stack"><div class="field"><label>Nome</label><input id="suppName" placeholder="Creatina, whey, vitaminas..." required></div><div class="form"><div class="field"><label>Dose</label><input id="suppDose" placeholder="3"></div><div class="field"><label>Unidade</label><select id="suppUnit"><option>g</option><option>mg</option><option>ml</option><option>cápsulas</option></select></div></div><div class="field"><label>Horário</label><input id="suppTime" type="time" value="${new Date().toTimeString().slice(0,5)}"></div><button class="btn primary">Registrar</button></form></div><div class="card s7"><h3>Hoje</h3>${items.map(x=>`<div class="item"><span>${esc(x.name)}<small>${esc(x.dose)} ${x.unit} · ${x.time}</small></span><button class="icon" data-del="${x.id}">×</button></div>`).join('')||'<div class="empty">Nenhum suplemento registrado.</div>'}</div></div>`}
return head('Nutrição','Alimentação, hidratação e suplementação.')+`<div class="tabs"><button data-nt="food" class="${nt==='food'?'active':''}">Alimentação</button><button data-nt="water" class="${nt==='water'?'active':''}">Água</button><button data-nt="supp" class="${nt==='supp'?'active':''}">Suplementos</button></div>${content}`}
const exercise=['Supino máquina','Puxada frontal','Remada baixa','Leg press','Cadeira extensora','Cadeira flexora','Elevação lateral','Tríceps pulley','Rosca bíceps','Panturrilha em pé'];
function training(){let content='';if(session){content=`<div class="card"><div class="row between"><div><b>Treino em andamento: ${esc(session.name)}</b><small class="muted">Iniciado ${session.start.slice(11,16)}</small></div><button class="btn danger" id="finish">Finalizar</button></div><div class="row" style="margin:12px 0"><select id="addEx">${exercise.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" id="addExBtn">Adicionar</button></div>${session.exercises.map((e,i)=>`<div class="card" style="margin-top:10px"><div class="row between"><b>${esc(e.name)}</b><button class="btn" data-addset="${i}">＋ Série</button></div>${e.sets.map((s,j)=>`<div class="form" style="margin-top:8px"><div class="field"><label>Série ${j+1} · carga kg</label><input type="number" step=".5" data-s="${i},${j},w" value="${s.w}"></div><div class="field"><label>Repetições</label><input type="number" data-s="${i},${j},r" value="${s.r}"></div><label><input type="checkbox" data-s="${i},${j},d" ${s.done?'checked':''} style="width:auto"> Concluída</label></div>`).join('')}<button class="btn" data-rest="60">Descanso 60s</button></div>`).join('')}<div id="timer" class="notice hidden"></div></div>`}
else if(tt==='templates'){content=`<div class="grid"><div class="card s5"><h3>Começar treino</h3><select id="templateChoice"><option value="">Treino livre</option>${p().templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`)}</select><button class="btn primary" id="start" style="margin-top:10px">Iniciar sessão</button></div><div class="card s7"><div class="row between"><h3>Minhas fichas</h3><button class="btn" data-modal="template">＋ Nova ficha</button></div>${p().templates.map(t=>`<div class="item"><div><b>${esc(t.name)}</b><small>${t.exercises.length} exercícios</small></div></div>`).join('')||'<div class="empty">Cadastre uma ficha ou comece um treino livre.</div>'}</div></div>`}
else if(tt==='library'){content=`<div class="card"><h3>Biblioteca de exercícios</h3>${exercise.map(x=>`<div class="item"><b>${x}</b><span class="muted">Musculação</span></div>`).join('')}</div>`}
else{let ws=recs('workout');content=`<div class="card"><h3>${tt==='history'?'Histórico de treinos':'Recordes pessoais'}</h3>${tt==='history'?ws.map(w=>`<div class="item"><span><b>${esc(w.name)}</b><small>${w.date} · ${w.duration} min</small></span><b>${nfmt(w.volume,0)} kg volume</b></div>`).join('')||'<div class="empty">Sem treinos registrados.</div>':recordList(ws)}</div>`}
return head('Treinamentos','Fichas, execução e desempenho.')+`<div class="tabs"><button data-tt="templates" class="${tt==='templates'?'active':''}">Fichas e treino</button><button data-tt="library" class="${tt==='library'?'active':''}">Exercícios</button><button data-tt="history" class="${tt==='history'?'active':''}">Histórico</button><button data-tt="records" class="${tt==='records'?'active':''}">Recordes</button></div>${content}`}
function recordList(ws){let best={};ws.forEach(w=>(w.exercises||[]).forEach(e=>e.sets.forEach(s=>{if(!best[e.name]||s.w>best[e.name])best[e.name]=s.w})));return Object.entries(best).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><b>${v} kg</b></div>`).join('')||'<div class="empty">Recordes aparecem após registrar cargas.</div>'}
function evolution(){let content='';if(et==='weight'){let ws=recs('weight');content=`<div class="grid">${metric('Peso atual',ws[0]?nfmt(ws[0].weight):'—','kg','Último registro')}${metric('Meta',p().goals.weight||'—','kg','Meta final')}${metric('Altura',p().profile.height||'—','cm','Perfil')}${metric('IMC',ws[0]&&p().profile.height?nfmt(ws[0].weight/(p().profile.height/100)**2):'—','','Calculado')}<div class="card s8"><h3>Histórico do peso</h3>${chart(ws.slice(0,30).reverse().map(x=>({date:x.date,v:x.weight})))}</div><div class="card s4"><h3>Registrar peso</h3><form id="weightForm" class="stack"><input id="weightVal" type="number" step=".1" placeholder="Peso em kg" required><input id="weightDate" type="date" value="${today()}"><button class="btn primary">Salvar</button></form></div><div class="card s12"><h3>Registros</h3>${ws.map(x=>`<div class="item"><span>${x.date}</span><b>${x.weight} kg</b><button class="icon" data-del="${x.id}">×</button></div>`).join('')||'<div class="empty">Sem registros.</div>'}</div></div>`}
if(et==='measures'){content=`<div class="grid"><div class="card s5"><h3>Registrar medidas (cm)</h3><form id="measureForm" class="form">${['waist:Cintura','abdomen:Abdômen','chest:Peitoral','shoulders:Ombros','armR:Braço direito','armL:Braço esquerdo','forearm:Antebraço','thighR:Coxa direita','thighL:Coxa esquerda','calfR:Panturrilha direita','calfL:Panturrilha esquerda'].map(x=>{let [k,l]=x.split(':');return `<div class="field"><label>${l}</label><input name="${k}" type="number" step=".1"></div>`}).join('')}<button class="btn primary full">Salvar medidas</button></form></div><div class="card s7"><h3>Histórico</h3>${recs('measurement').map(m=>`<div class="item"><span>${m.date}<small>Cintura ${m.waist||'—'} · Abdômen ${m.abdomen||'—'}</small></span><button class="icon" data-del="${m.id}">×</button></div>`).join('')||'<div class="empty">Sem medidas.</div>'}</div></div>`}
if(et==='body'){content=`<div class="grid"><div class="card s5"><h3>Composição corporal</h3><form id="bodyForm" class="stack"><div class="field"><label>Gordura corporal (%)</label><input id="bf" type="number" step=".1"></div><div class="field"><label>Massa muscular (kg)</label><input id="mm" type="number" step=".1"></div><input id="bodyDate" type="date" value="${today()}"><button class="btn primary">Salvar</button></form></div><div class="card s7"><h3>Histórico</h3>${recs('body').map(x=>`<div class="item"><span>${x.date}</span><b>${x.bf||'—'}% · ${x.mm||'—'} kg</b></div>`).join('')||'<div class="empty">Sem registros.</div>'}</div></div>`}
if(et==='photos'){content=`<div class="grid"><div class="card s5"><h3>Foto de evolução</h3><form id="photoForm" class="stack"><input id="photoFile" type="file" accept="image/*" required><select id="pose"><option>Frente</option><option>Lado</option><option>Costas</option><option>Outra</option></select><input id="photoDate" type="date" value="${today()}"><select id="quality"><option value=".6">Compacta</option><option value=".8" selected>Equilibrada</option><option value=".92">Alta</option></select><button class="btn primary">Salvar foto</button></form><small class="muted">A foto é comprimida antes de ser salva.</small></div><div class="card s7"><h3>Galeria</h3><div class="grid">${p().photos.map(ph=>`<div class="s6"><img class="photo" src="${URL.createObjectURL(ph.blob)}"><small>${ph.date} · ${esc(ph.pose)}</small></div>`).join('')||'<div class="empty s12">Sem fotos.</div>'}</div></div></div>`}
return head('Evolução','Peso, medidas e composição corporal.')+`<div class="tabs"><button data-et="weight" class="${et==='weight'?'active':''}">Peso</button><button data-et="measures" class="${et==='measures'?'active':''}">Medidas</button><button data-et="body" class="${et==='body'?'active':''}">Composição</button><button data-et="photos" class="${et==='photos'?'active':''}">Fotos</button></div>${content}`}
function profile(){let pr=p();return head('Perfil e configurações','Dados, metas, calendário e gerenciamento.')+`<div class="grid"><div class="card s6"><h3>Dados pessoais</h3><form id="profileForm" class="form"><div class="field"><label>Nome do perfil</label><input id="pname" value="${esc(pr.name)}"></div><div class="field"><label>Idade</label><input id="age" type="number" value="${pr.profile.age||''}"></div><div class="field"><label>Altura (cm)</label><input id="height" type="number" step=".1" value="${pr.profile.height||''}"></div><button class="btn primary full">Salvar perfil</button></form></div><div class="card s6"><h3>Metas</h3><form id="goalsForm" class="form"><div class="field"><label>Peso desejado (kg)</label><input id="gweight" type="number" step=".1" value="${pr.goals.weight||''}"></div><div class="field"><label>Ritmo semanal (kg)</label><input id="rate" type="number" step=".1" value="${pr.goals.weeklyRate}"></div>${[['calories','Calorias kcal'],['protein','Proteínas g'],['carbs','Carboidratos g'],['fat','Gorduras g'],['water','Água ml']].map(x=>`<div class="field"><label>${x[1]}</label><input id="g-${x[0]}" type="number" value="${pr.goals[x[0]]}"></div>`).join('')}<button class="btn primary full">Salvar metas</button><button type="button" class="btn full" id="suggest">Sugerir metas estimadas</button></form></div><div class="card s6"><h3>Calendário</h3><div class="row between"><button class="btn" id="prev">‹</button><b id="monthLabel"></b><button class="btn" id="next">›</button></div><div id="calendar" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px"></div><small class="muted">Dias com registros ficam destacados.</small></div><div class="card s6"><h3>Backup e dados</h3><p class="muted">Backup JSON completo do perfil, incluindo fotos.</p><div class="row"><button class="btn primary" id="backup">Exportar perfil</button><button class="btn" id="restore">Importar backup</button><input id="backupFile" class="hidden" type="file" accept=".json,application/json"></div><div class="row" style="margin-top:8px"><button class="btn" id="csv">Exportar CSV</button><button class="btn" id="diagnostic">Diagnóstico</button></div><div id="diag" class="notice hidden" style="margin-top:10px"></div></div><div class="card s6"><h3>Aparência</h3><div class="field"><label>Tema</label><select id="theme"><option value="system">Automático</option><option value="dark">Escuro</option><option value="light">Claro</option></select></div><div class="field"><label>Cor de destaque</label><input id="accent" type="color" value="${settings.accent}"></div><button class="btn" id="saveAppearance">Salvar aparência</button></div><div class="card s6"><h3>Gerenciar perfis</h3><div class="row"><button class="btn primary" id="newProfile">＋ Novo perfil</button><button class="btn danger" id="removeProfile">Excluir perfil</button></div><p class="muted">Perfis são separados logicamente, sem PIN ou criptografia. Não compartilhe o dispositivo com pessoas não autorizadas se seus dados forem privados.</p></div><div class="card s12"><h3>Relatório PDF</h3><p class="muted">Selecione o período e os tópicos. Na janela de impressão, escolha “Salvar como PDF”.</p><div class="form"><div class="field"><label>De</label><input id="from" type="date" value="${new Date(Date.now()-30*86400000).toISOString().slice(0,10)}"></div><div class="field"><label>Até</label><input id="to" type="date" value="${today()}"></div></div><div class="row"><label><input type="checkbox" class="pdfopt" value="weight" checked style="width:auto"> Peso</label><label><input type="checkbox" class="pdfopt" value="meal" checked style="width:auto"> Nutrição</label><label><input type="checkbox" class="pdfopt" value="workout" checked style="width:auto"> Treinos</label><label><input type="checkbox" class="pdfopt" value="measurement" checked style="width:auto"> Medidas</label></div><button class="btn primary" id="pdf">Gerar relatório</button></div></div>`}
function add(r){p().records.push({id:uid(),date:today(),...r});saveP().then(render)}
function wire(){
$$('[data-pagego]').forEach(b=>b.onclick=()=>{page=b.dataset.pagego;render()});
$$('[data-nt]').forEach(b=>b.onclick=()=>{nt=b.dataset.nt;render()});$$('[data-tt]').forEach(b=>b.onclick=()=>{tt=b.dataset.tt;render()});$$('[data-et]').forEach(b=>b.onclick=()=>{et=b.dataset.et;render()});
$$('[data-water]').forEach(b=>b.onclick=()=>add({type:'water',amount:+b.dataset.water,time:new Date().toTimeString().slice(0,5)}));
$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir registro?')){p().records=p().records.filter(x=>x.id!==b.dataset.del);saveP().then(render)}});
$$('[data-modal]').forEach(b=>b.onclick=()=>modal(b.dataset.modal));
if($('#foodSearch'))$('#foodSearch').oninput=e=>{let q=e.target.value.toLowerCase();$('#foodSel').innerHTML=foods.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.kcal} kcal/100g</option>`).join('')};
if($('#mealForm'))$('#mealForm').onsubmit=e=>{e.preventDefault();let f=foods.find(x=>x.id===$('#foodSel').value),g=+$('#grams').value,m=g/100;if(!f)return;add({type:'meal',name:f.name,grams:g,mealType:$('#mealType').value,time:$('#mealTime').value,kcal:f.kcal*m,protein:f.protein*m,carbs:f.carbs*m,fat:f.fat*m,estimated:f.estimated||false})};
if($('#waterForm'))$('#waterForm').onsubmit=e=>{e.preventDefault();add({type:'water',amount:+$('#waterAmount').value,time:$('#waterTime').value})};
if($('#suppForm'))$('#suppForm').onsubmit=e=>{e.preventDefault();add({type:'supplement',name:$('#suppName').value,dose:$('#suppDose').value,unit:$('#suppUnit').value,time:$('#suppTime').value})};
if($('#weightForm'))$('#weightForm').onsubmit=e=>{e.preventDefault();add({type:'weight',weight:+$('#weightVal').value,date:$('#weightDate').value})};
if($('#measureForm'))$('#measureForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));add({type:'measurement',...Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v?+v:null]))})};
if($('#bodyForm'))$('#bodyForm').onsubmit=e=>{e.preventDefault();add({type:'body',bf:+$('#bf').value||null,mm:+$('#mm').value||null,date:$('#bodyDate').value})};
if($('#profileForm'))$('#profileForm').onsubmit=e=>{e.preventDefault();p().name=$('#pname').value;p().profile.age=+$('#age').value||null;p().profile.height=+$('#height').value||null;saveP().then(render)};
if($('#goalsForm'))$('#goalsForm').onsubmit=e=>{e.preventDefault();p().goals={weight:+$('#gweight').value||null,weeklyRate:+$('#rate').value||.25,calories:+$('#g-calories').value,protein:+$('#g-protein').value,carbs:+$('#g-carbs').value,fat:+$('#g-fat').value,water:+$('#g-water').value};saveP().then(render)};
if($('#suggest'))$('#suggest').onclick=()=>{let w=recs('weight')[0]?.weight,h=p().profile.height;if(!w||!h){alert('Registre peso e altura primeiro.');return}let bmr=10*w+6.25*h-5*(p().profile.age||25)+5,cal=Math.round(bmr*1.45);$('#g-calories').value=cal;$('#g-protein').value=Math.round(w*1.8);$('#g-fat').value=Math.round(w*.9);$('#g-carbs').value=Math.round((cal-$('#g-protein').value*4-$('#g-fat').value*9)/4);alert('Sugestões aproximadas preenchidas. Revise antes de salvar.')};
if($('#start'))$('#start').onclick=()=>{let t=p().templates.find(x=>x.id===$('#templateChoice').value);session={name:t?.name||'Treino livre',start:new Date().toISOString(),exercises:(t?.exercises||[]).map(name=>({name,sets:[{w:0,r:0,done:false},{w:0,r:0,done:false},{w:0,r:0,done:false}]}))};render()};
if($('#addExBtn'))$('#addExBtn').onclick=()=>{session.exercises.push({name:$('#addEx').value,sets:[{w:0,r:0,done:false},{w:0,r:0,done:false},{w:0,r:0,done:false}]});render()};
$$('[data-addset]').forEach(b=>b.onclick=()=>{session.exercises[+b.dataset.addset].sets.push({w:0,r:0,done:false});render()});
$$('[data-s]').forEach(el=>el.onchange=()=>{let [i,j,k]=el.dataset.s.split(',');session.exercises[+i].sets[+j][k]=k==='d'?el.checked:+el.value});
$$('[data-rest]').forEach(b=>b.onclick=()=>{let end=Date.now()+60000,box=$('#timer');box.classList.remove('hidden');let tick=()=>{let n=Math.max(0,Math.ceil((end-Date.now())/1000));box.textContent=`Descanso: ${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(n)setTimeout(tick,250);else box.textContent='Descanso concluído'};tick()});
if($('#finish'))$('#finish').onclick=()=>{if(!confirm('Finalizar e salvar treino?'))return;let dur=Math.round((Date.now()-new Date(session.start))/60000),vol=session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+s.w*s.r,0),0);add({type:'workout',name:session.name,duration:dur,volume:vol,exercises:session.exercises});session=null;tt='history'};
if($('#templateForm')){} // modal forms are bound in modal()
if($('#photoForm'))$('#photoForm').onsubmit=async e=>{e.preventDefault();let f=$('#photoFile').files[0],blob=await compress(f,+$('#quality').value);p().photos.push({id:uid(),date:$('#photoDate').value,pose:$('#pose').value,blob,size:blob.size});await saveP();render()};
if($('#newProfile'))$('#newProfile').onclick=createProfile;
if($('#removeProfile'))$('#removeProfile').onclick=removeProfile;
if($('#backup'))$('#backup').onclick=backup;
if($('#restore'))$('#restore').onclick=()=>$('#backupFile').click();
if($('#backupFile'))$('#backupFile').onchange=restore;
if($('#csv'))$('#csv').onclick=csv;
if($('#diagnostic'))$('#diagnostic').onclick=diagnostic;
if($('#saveAppearance'))$('#saveAppearance').onclick=async()=>{settings.theme=$('#theme').value;settings.accent=$('#accent').value;await saveSettings();applyTheme();render()};
if($('#pdf'))$('#pdf').onclick=pdf;
}
function modal(type){let content=type==='food'?`<h3>Cadastrar alimento (valores por 100 g)</h3><form id="foodForm" class="stack"><div class="field"><label>Nome</label><input id="fn" required></div><div class="form">${[['kcal','Calorias'],['protein','Proteínas'],['carbs','Carboidratos'],['fat','Gorduras'],['fiber','Fibras']].map(x=>`<div class="field"><label>${x[1]}</label><input id="f-${x[0]}" type="number" step=".1" value="0"></div>`).join('')}</div><button class="btn primary">Salvar alimento</button></form>`:`<h3>Criar ficha de treino</h3><form id="templateForm" class="stack"><div class="field"><label>Nome da ficha</label><input id="tname" required></div><div class="field"><label>Exercícios (um por linha)</label><textarea id="tex"></textarea></div><button class="btn primary">Salvar ficha</button></form>`;
$('#modalRoot').innerHTML=`<div class="modalbg" id="mb"><div class="modal"><div class="row between"><b>BODYTRACK</b><button class="icon" id="mc">×</button></div>${content}</div></div>`;$('#mc').onclick=()=>$('#modalRoot').innerHTML='';$('#mb').onclick=e=>{if(e.target.id==='mb')$('#modalRoot').innerHTML=''};
if($('#foodForm'))$('#foodForm').onsubmit=async e=>{e.preventDefault();let f={id:uid(),name:$('#fn').value,category:'Personalizado',kcal:+$('#f-kcal').value,protein:+$('#f-protein').value,carbs:+$('#f-carbs').value,fat:+$('#f-fat').value,fiber:+$('#f-fiber').value};await put('foods',f);foods=await all('foods');$('#modalRoot').innerHTML='';render()};
if($('#templateForm'))$('#templateForm').onsubmit=async e=>{e.preventDefault();p().templates.push({id:uid(),name:$('#tname').value,exercises:$('#tex').value.split('\n').map(x=>x.trim()).filter(Boolean)});await saveP();$('#modalRoot').innerHTML='';render()}}
async function createProfile(){let name=prompt('Nome do perfil:');if(!name)return;let x=mkProfile(name);await put('profiles',x);profiles=await all('profiles');activeId=x.id;render()}
async function removeProfile(){if(profiles.length<2){alert('Mantenha pelo menos um perfil.');return}if(!confirm('Excluir perfil? Recomendamos exportar o backup antes.'))return;if(confirm('Exportar backup antes de excluir?'))await backup();if(!confirm('Confirma a exclusão definitiva?'))return;await del('profiles',activeId);profiles=await all('profiles');activeId=profiles[0].id;render()}
async function blobData(b){return new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)})}
async function backup(){let x=JSON.parse(JSON.stringify({...p(),photos:[]}));let photos=[];for(let ph of p().photos)photos.push({date:ph.date,pose:ph.pose,data:await blobData(ph.blob)});download(JSON.stringify({format:'bodytrack-backup',version:1,profile:x,photos,exportedAt:new Date().toISOString()}),`bodytrack-${p().name}-${today()}.json`,'application/json')}
async function restore(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.format!=='bodytrack-backup')throw Error('Formato inválido');let mode=prompt('1 = substituir perfil atual; 2 = mesclar registros');if(!['1','2'].includes(mode))return;if(mode==='1'){let oldid=activeId;Object.assign(p(),d.profile,{id:oldid,photos:[]})}else p().records.push(...(d.profile.records||[]).map(x=>({...x,id:uid()})));for(let ph of d.photos||[])p().photos.push({id:uid(),date:ph.date,pose:ph.pose,blob:await(await fetch(ph.data)).blob()});await saveP();alert('Backup restaurado.');render()}catch(err){alert('Erro ao importar: '+err.message)}e.target.value=''}
function download(data,name,type){let b=new Blob([data],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csv(){let rows=[['tipo','data','detalhes'],...p().records.map(x=>[x.type,x.date,JSON.stringify(x)])],s=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');download('\ufeff'+s,`bodytrack-${today()}.csv`,'text/csv;charset=utf-8')}
async function diagnostic(){let count=p().records.length,bytes=0;for(let ph of p().photos)bytes+=ph.blob.size;let el=$('#diag');el.classList.remove('hidden');el.textContent=`Perfis: ${profiles.length} · Registros neste perfil: ${count} · Fotos: ${p().photos.length} · Tamanho das fotos: ${(bytes/1024/1024).toFixed(2)} MB. Estimativa parcial do armazenamento.`}
function pdf(){let from=$('#from').value,to=$('#to').value,types=$$('.pdfopt:checked').map(x=>x.value),r=p().records.filter(x=>x.date>=from&&x.date<=to);let html=`<h1>BodyTrack — ${esc(p().name)}</h1><p>Período: ${from} a ${to}</p>`;for(let t of types){let arr=r.filter(x=>x.type===t);html+=`<h2>${t}</h2><table>${arr.map(x=>`<tr><td>${x.date}</td><td>${esc(x.name||'')}</td><td>${esc(x.weight??x.kcal??x.volume??'')}</td></tr>`).join('')}</table>`}let w=window.open('','_blank');if(!w){alert('Permita pop-ups para gerar o relatório.');return}w.document.write(`<html><head><title>BodyTrack PDF</title><style>body{font:14px Arial;padding:30px}table{border-collapse:collapse;width:100%}td{border:1px solid #ddd;padding:7px}</style></head><body>${html}<script>onload=()=>print()<\/script></body></html>`);w.document.close()}
async function compress(file,q){let bmp=await createImageBitmap(file),scale=Math.min(1,1800/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=bmp.width*scale;c.height=bmp.height*scale;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',q))}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
init().catch(e=>{console.error(e);$('#main').innerHTML='<div class="empty">Não foi possível iniciar o banco local. Abra pelo HTTPS do GitHub Pages.</div>'});
})();
</script></body></html>
